timeout: 3
serial: yes

/T2Linux (b8g-ghost CAS — Interactive Shell)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=tty0 console=ttyS0,115200
    module_path: boot():/boot/initramfs.cpio.zst

/T2Linux (Serial Console — QEMU / Proxmox)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyS0,115200
    module_path: boot():/boot/initramfs.cpio.zst

/T2Linux (CI Self-Test)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyS0,115200 quiet t2.selftest=1
    module_path: boot():/boot/initramfs.cpio.zst
